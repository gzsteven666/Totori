name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 必须通过：只依赖 Command Line Tools，验证源码能编译、组装并通过签名检查。
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swiftc --version
      - name: Build
        env:
          TOTORI_OUTPUT_APP: ${{ runner.temp }}/Totori.app
        run: ./build.sh

  # 转换自检：需要 ffmpeg / cwebp / LibreOffice。系统 ImageIO 不能编码的格式（如虚拟机上的 AVIF）会自动跳过。
  selftest:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install conversion tools
        run: |
          brew install ffmpeg webp
          # cask 下载偶尔 404（新版刚发布、镜像还没同步）；重试一次，仍失败则跳过文档用例而不是让整个 CI 失败
          brew install --cask libreoffice || { sleep 20; brew install --cask libreoffice; } \
            || echo "::warning::LibreOffice 安装失败，本次自检会跳过文档转换用例"
      - name: Build
        env:
          TOTORI_OUTPUT_APP: ${{ runner.temp }}/Totori.app
        run: ./build.sh
      - name: Self test
        run: |
          export PATH="/Applications/LibreOffice.app/Contents/MacOS:$PATH"
          "$RUNNER_TEMP/Totori.app/Contents/MacOS/Totori" --selftest
      - name: Document PDF probe
        run: |
          export PATH="/Applications/LibreOffice.app/Contents/MacOS:$PATH"
          "$RUNNER_TEMP/Totori.app/Contents/MacOS/Totori" --probe-document-pdf
